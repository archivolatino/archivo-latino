# builds the site on every push to main, which includes every publish from the cms, and puts it on
# github pages. the repository's settings > pages > source has to be set to github actions
name: Deploy

on:
  push:
    branches: [main]
  # a run button on the actions tab, for rebuilding without a change
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# pushes close together wait their turn, and a deploy is never cut off halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run build

      # the pages are written into the repository root, so the site is a copy of the root without
      # what .pagesignore lists
      - run: rsync -a --exclude=/_site --exclude-from=.pagesignore ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
